</header><main class="page"><header class="page-head"><div class="symbol">✦</div><p>2026.11.11</p><h1>森博嗣『幻惑の死と使途』感想</h1></header><article class="story">
<p>以下ネタバレあり。</p>
<p>トリックの肝は替え玉がいることだったが、もう少しその伏線がほしかった。原沼を見たときに誰かに似ている感じがした、とか。県警内に一大学生のファンクラブがあるのにはちょっと引く。真相に思い至った萌絵が危ない目に遭っていてはらはらする。そろそろ学習してほしい。前作のエイプリルフールの一件から萌絵を見る目が変わってしまった。</p>
<p>名詞に関わる犀川先生の話が面白かった。こういう台詞が楽しみで読むのをやめられない。</p>
