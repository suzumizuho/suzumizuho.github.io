</header><main class="page"><header class="page-head"><div class="symbol">✦</div><p>2026.11.24</p><h1>アガサ・クリスティー『運命の裏木戸』（中村能三訳）感想 </h1></header><article class="story">
<p>トミー＆タペンスものの最後の長編を読んだ。</p>
<p>人々の会話が中心になって話が進んでいく。全体的に冗長で、危機に陥ったときのはらはら感、謎が解けたときの爽快感もあまりなかった。</p>
<p>途中で読むのをやめた『ホロー荘の殺人』ほどではなかったけれど、こちらも鋭さやスピード感がもう少しあれば、と思った。</p>
