<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ブログ — 白露の庭</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="site-header">
<a class="brand" href="../index.html">白露の庭</a>
<nav class="nav"><a href="../novel/index.html">作品</a><a href="../blog/index.html">ブログ</a><a href="../about.html">About</a></nav>
</header><main class="page"><header class="page-head"><div class="symbol">☾</div><h1>ブログ</h1><p>JOURNAL</p></header><section class="blog-list">
  <div id="blog-list">
    <p>記事を読み込んでいます……</p>
  </div>
</section><script>
(async () => {
  const list = document.getElementById("blog-list");

    const host = location.hostname;
  const owner = host.split(".")[0];
  const repo = owner + ".github.io";

  try {
    const response = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/blog`,
      {
        headers: {
          "Accept": "application/vnd.github+json"
        }
      }
    );

    if (!response.ok) throw new Error("GitHub API error");

const files = await response.json();

const posts = files
      .filter(file => /^\d{8}(?:-\d+)?\.html$/i.test(file.name))
      .sort((a, b) => {
        const ma = a.name.match(/^(\d{8})(?:-(\d+))?/);
        const mb = b.name.match(/^(\d{8})(?:-(\d+))?/);

        const dateA = ma[1];
        const dateB = mb[1];

        if (dateA !== dateB) {
          return dateB.localeCompare(dateA);
        }

          const numA = Number(ma[2] || 0);
        const numB = Number(mb[2] || 0);

        return numB - numA;
      });

    if (!posts.length) {
      list.innerHTML = "<p>現在、記事はありません。</p>";
      return;
    }

      const articles = await Promise.all(
      posts.map(async file => {
        try {
          const res = await fetch(file.download_url);
          const html = await res.text();

          const doc = new DOMParser().parseFromString(
            html,
            "text/html"
          );

          const title =
            doc.querySelector("h1")?.textContent.trim() ||
            doc.querySelector("h2")?.textContent.trim() ||
            file.name.replace(/\.html$/i, "");

          const description =
            doc.querySelector('meta[name="description"]')?.content.trim() ||
            doc.querySelector("article p")?.textContent.trim() ||
            doc.querySelector("p")?.textContent.trim() ||
            "";

          const match = file.name.match(/^(\d{4})(\d{2})(\d{2})/);

          const date = match
            ? `${match[1]}.${match[2]}.${match[3]}`
            : "";

           return `
            <article>
              <time>${date}</time>
              <h2>
                <a href="${file.name}">${escapeHtml(title)}</a>
              </h2>
              <p>${escapeHtml(description)}</p>
            </article>
          `;
        } catch {
          return "";
        }
      })
    );

     list.innerHTML = articles.join("");

    } catch {
    list.innerHTML =
      "<p>記事一覧を読み込めませんでした。少し時間を置いて、もう一度お試しください。</p>";
  }

    function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
})();
</script>
    
  </main><footer class="footer"><a href="../index.html">☾ HOME</a></footer></body></html>
