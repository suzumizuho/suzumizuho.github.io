</header><main class="page"><header class="page-head"><div class="symbol">✦</div><p>2026.10.13</p><h1>山尾悠子『鏡の角度』感想<h1></header><article class="story">
<p>小説のような、詩のような作品集。掌編と言ってもいいだろうか。『鏡の角度』を読みながら、得も言われぬ満足感を覚えた。</p>
<p>この作者の持ち味は硬質な文章と独特の世界観だと思っているが、今作でもそれが遺憾なく発揮されていた。芸術が多く関連していて、その辺りの知識があればもっと楽しめたと思う。読み方や意味の分からない単語も出てきた。辞書を引きながら読みたい。</p>
<p>読んでいたら創作意欲が刺激されて、掌編『夢水』を一気に書き上げた。人の想像力を羽ばたかせる作品は傑作だと思う。</p>
</article></main><footer class="footer">☾</footer></body></html>
