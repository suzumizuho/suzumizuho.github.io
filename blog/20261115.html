</header><main class="page"><header class="page-head"><div class="symbol">✦</div><p>2026.11.15</p><h1>「アメリ」を観てきた</h1></header><article class="story">
<p>公開25周年で再上映されている「アメリ」を観てきた。</p>
<p>内気なアメリが幸せをつかむまでの物語。初めて観たのがけっこう前なので忘れているところも多かった。アメリのしかけたいたずらで一番好きなのが、カフェの常連客である客室乗務員にドワーフを預けて各地へ旅行させ、撮ってもらった写真を父親に送るというもの。最後には父親も旅に出る決心をする。アメリが宝箱を返した男性が孫と触れ合っているシーンにも心温まる。</p>
<p>粗暴な人間を睨んだり、にっこり微笑んだりと役者さんの表情の移り変わりに見入ってしまった。</p>
