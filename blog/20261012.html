</header><main class="page"><header class="page-head"><div class="symbol">✦</div><p>2026.10.12</p><h1>より本格的なログハウス建築<h1></header><article class="story">
<p>今日も推しシンガーの配信を聞きながら、動画を参考にしてログハウスを作った。前回のものよりも本格的。ちょこちょこ動画と違っている部分もある。この時季なので外のランタンはすべてジャック・オ・ランタンにしてみた。クリスマスシーズンになったら装飾を変えてツリーも置きたい。</p>
<p>家の周りに木を生やして森の中にしたい。フラットだと広い地形が最初から確保されていて楽だけど、建物が殺風景な中にぽつんと建っている感じになってしまう。</p>
