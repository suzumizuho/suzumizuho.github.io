<p>タペンスとトミーの二人が消えた極秘文書の行方を追う冒険譚。とても面白かった。</p>
<p>英国を揺るがす機密文書を追うという物語のスケールが大きく、伏線が巧みに張られていて、先が気になって一気に読んだ。書類の行き先と陰謀を企む組織のトップは誰かという謎がとても魅力的。後者については予想が当たってしまったが、それでもはらはらできた。主役二人のロマンスも上手く物語に溶け込んでいてよかった。</p>
