</header><main class="page"><header class="page-head"><div class="symbol">☾</div><div class="chapter">詩</div><h1 class="story-title">もうそんな季節</h1></header><article class="story"><div class="poem">
<p>身震いがした
<br>風邪――ではない
<br>さっき飲んだ冷たい牛乳が
<br>体の芯を冷やしたのだ

<p>もうそんな季節なのだなあ</p>

<p>お気に入りのマグカップは
<br>確かに電子レンジ対応だった
<br>ボタンを押して一分待って
<br>音が鳴ったら</p>

<p>温められた牛乳は
<br>誘うようにただただ白い</p>

<p>ああ、ほっとする</p>

<p>もう、そんな季節か</p>

<p>遠くから
<br>鈴の音が聞こえた気がした</p>
</div>
