<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品 — 白露の庭</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">白露の庭</a>
  <nav class="nav">
    <a href="index.html">作品</a>
    <a href="../blog/index.html">ブログ</a>
    <a href="../about.html">About</a>
  </nav>
</header>

<main class="page">
  <header class="page-head">
    <div class="symbol">✦</div>
    <h1>作品</h1>
    <p>WORKS</p>
  </header>

  <div class="cards" id="works-list">
    <p>作品を読み込んでいます……</p>
  </div>
</main>

<footer class="footer"><a href="../index.html">← HOME</a></footer>

<script>
(async () => {
  const list = document.getElementById("works-list");
  const host = location.hostname;
  const owner = host.split(".")[0];
  const repo = owner + ".github.io";

  try {
    const response = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/novel`,
      { headers: { "Accept": "application/vnd.github+json" } }
    );
    if (!response.ok) throw new Error("GitHub API error");

    const files = await response.json();
    const stories = files
      .filter(file => /^story-\d+\.html$/i.test(file.name))
      .sort((a, b) => {
        const na = Number(a.name.match(/\d+/)[0]);
        const nb = Number(b.name.match(/\d+/)[0]);
        return nb - na;
      });

    if (!stories.length) {
      list.innerHTML = "<p>現在、作品はありません。</p>";
      return;
    }

    const cards = await Promise.all(stories.map(async file => {
      try {
        const res = await fetch(file.download_url);
        const doc = new DOMParser().parseFromString(await res.text(), "text/html");
        const title = doc.querySelector("h1")?.textContent.trim() || file.name.replace(/\.html$/i, "");
        const type = doc.querySelector(".work-type")?.textContent.trim() ||
                     doc.querySelector("small")?.textContent.trim() || "掌編";
        const description = doc.querySelector('meta[name="description"]')?.content.trim() || "";

        return `<a class="card" href="${file.name}">
          <small>${escapeHtml(type)}</small>
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(description)}</p>
        </a>`;
      } catch {
        return `<a class="card" href="${file.name}">
          <small>作品</small>
          <h3>${escapeHtml(file.name.replace(/\.html$/i, ""))}</h3>
          <p></p>
        </a>`;
      }
    }));

    list.innerHTML = cards.join("");
  } catch {
    list.innerHTML = "<p>作品一覧を読み込めませんでした。少し時間を置いて、もう一度お試しください。</p>";
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
})();
</script>
</body>
</html>
