</header><main class="page"><header class="page-head"><div class="symbol">☾</div><div class="chapter">詩</div><h1 class="story-title">一滴の美</h1></header><article class="story"><div class="poem">
<p>それは天上の花<br>天使の口づけで色づいた赤が<br>今は地上で陽光に照らされている<br></p><p>それはうなだれる花<br>自らの美しさが重いのか<br>地面に向かって開いている</p><p>じっと見つめていると<br>凝縮された花の美の露が<br>一滴ぽたりと落ちていった</p>
