<nav class="nav"><a href="../novel/index.html">作品</a><a href="../blog/index.html">ブログ</a><a href="../about.html">About</a></nav></header><main class="page"><header class="page-head"><div class="symbol">☾</div><div class="chapter">詩</div><h1 class="story-title">りんご</h1></header><article class="story"><div class="poem"><p>まあるいりんご　見つめているだけで<br>いろんな未来が想像できる<br>ジャムにジュースにアップルパイ<br>鏡の中の自分だって<br>見つめるだけで　未来が思い浮かべばいいのにな</p><p>真っ赤なりんご　見つめているだけで<br>いろんな物語を連想できる<br>禁断の果実　死神のおやつ<br>ノートの上のペン先だって<br>たちまち何かを描き出せればいいのにな</p><p>りんご　思い出すだけで<br>果汁がわいてきそうな名前</p></article><nav class="story-nav"><a href="index.html">← 作品一覧</a><span>完</span><a href="../index.html">白露の庭 →</a></nav></main><footer class="footer">✦</footer></body></html>
