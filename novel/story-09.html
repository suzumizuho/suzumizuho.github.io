</header><main class="page"><header class="page-head"><div class="symbol">☾</div><div class="chapter">詩</div><h1 class="story-title">春の足音</h1></header><article class="story"><div class="poem"><p>長らく語り合っていた友が<br>時計を見て立ち上がる<br>帽子を手に取り<br>にっこりこちらに微笑んでみせる<br></p><p>もうお別れの時間です<br>耳を澄ましてごらんなさい<br></p><p>雪解け水の流れる音が<br>新芽が顔を出す音が<br>聞こえるでしょう<br>これは私のかつての足音<br></p><p>そして今</p><p>軽やかに近づいてくる<br>新しい足音<br></p><p>旧友は扉を開いて<br>振り向かないで立ち去った<br></p></div></article><nav class="story-nav"><a href="index.html">← 作品一覧</a><span>完</span><a href="../index.html">白露の庭 →</a></nav></main><footer class="footer">✦</footer></body></html>
