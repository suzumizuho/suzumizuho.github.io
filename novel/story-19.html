</header><main class="page"><header class="page-head"><div class="symbol">☾</div><div class="chapter">詩</div><h1 class="story-title">青い遊具</h1></header><article class="story"><div class="poem">
<p>その青い遊具を見ていたら<br>誰かの笑い声が聞こえた気がした<br>無邪気で<br>純粋な楽しさから出た笑い声</p><p>その青い遊具自身も<br>無邪気に笑っている<br>あるいは<br>遊具の声かもしれない<br>記憶の中の声かもしれない</p><p>手で触ってみたら<br>思い出がひらめいた<br>遊んだ思い出<br>笑った思い出</p><p>もうこれでは遊べないけれど<br>堆積された過去の日々が<br>確かに残っている</p></div>
